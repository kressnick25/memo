name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '>=1.22'  # Set your Go version here

      - name: Build binary
        run: |
          go build -v -o memo

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: memo
